<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b4b"><meta name="description" content="no:9 ev birası üretim ve stok defteri"><link rel="manifest" href="/manifest.webmanifest"><title>no:9 — Bira Defteri</title><link rel="stylesheet" href="/app.css"><link rel="icon" type="image/svg+xml" href="/icon.svg"><body><aside><div class="brand"><img src="/assets/no9-label.jpg" alt="no:9 Ankara Birası — el yapımı, sınırlı üretim" width="1280" height="683"></div><div class="tag">ANKARA · EL YAPIMI BİRA</div><nav><button data-page="overview" class="active"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></i>Genel bakış</button><button data-page="batches"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-5 0v5l-3 4v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-8l-3-4V3M7 14h10M10 17h4"/></svg></i>Üretimlerim</button><button data-page="stock"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v13H3zM3 4h18v4M8 11v7m4-7v7m4-7v7"/></svg></i>Şişe & stok</button><button data-page="settings"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="15" cy="17" r="3" fill="currentColor"/></svg></i>Ayarlar</button></nav><div class="aside-bottom">İyi bira biraz sabır ister.<div class="small-brand">Ankara’dan, özenle.<br>El yapımı · Sınırlı üretim</div></div></aside><main><header class="top"><span class="mobile-logo"><img src="/assets/no9-label.jpg" alt="no:9 Ankara Birası" width="1280" height="683"></span><span class="date" id="today"></span><div class="status"><span class="dot"></span><span id="sync">Bağlanıyor…</span></div></header><div id="content"><div class="loading">Bira defterin açılıyor…</div></div><footer><span>Özenle kur. Sabırla bekle. Keyifle iç.</span><span>no:9 · bira defteri</span></footer></main><dialog id="modal"></dialog><div class="toast" role="status" id="toast"></div><script>
const $=s=>document.querySelector(s);let batches=[],page='overview',filter='all',user='',installPrompt;const day=86400000,stages=['Mayalama','Şişeleme','Olgunlaşma','İçime hazır'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});const today=()=>new Date().toLocaleDateString('en-CA');const daysSince=d=>Math.floor((Date.parse(today()+'T12:00:00Z')-Date.parse(d+'T12:00:00Z'))/day);const stage=b=>b.bottled?(daysSince(b.bottled)>=b.conditionDays?3:2):(daysSince(b.started)>=b.fermentDays?1:0);function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok){let v=await r.json().catch(()=>({error:'Sunucuya ulaşılamadı'}));throw Error(v.error||'İşlem tamamlanamadı')}return r.json()}
async function load(){try{let data=await api('batches');batches=data.batches;user=data.user;$('#sync').textContent='Bulutla eşitlendi';render()}catch(e){$('#sync').textContent='Bağlantı kurulamadı';$('#content').innerHTML='<div class="empty"><h3>Deftere bağlanamadık</h3><p>'+esc(e.message)+'</p><p class="hint">İnternet bağlantını kontrol edip yeniden dene.</p><button class="secondary" onclick="load()">Yeniden dene</button></div>'}}
function sipPanel(b){const plan=brewPlan(b);return `<div class="sip-date"><div><div class="label">${plan.estimated?'Tahmini ilk içim':'En erken ilk içim'}</div><strong><time datetime="${plan.firstSip}">${date(plan.firstSip)}</time></strong><small>${plan.estimated?date(plan.bottleTarget)+' tarihinde şişelersen · '+b.conditionDays+' gün olgunlaşma':b.conditionDays+' gün şişede olgunlaşmanın ardından'}</small></div><span class="sip-symbol" aria-hidden="true">♧</span></div>`}
function card(b){let s=stage(b),elapsed=daysSince(b.bottled||b.started),duration=b.bottled?b.conditionDays:b.fermentDays,remaining=Math.max(0,duration-elapsed),percent=Math.min(100,Math.max(0,elapsed/duration*100)),plan=brewPlan(b);return `<article class="card"><div class="card-top"><div><div class="batch-no">PARTİ #${esc(b.number)}</div><h3>${esc(b.name)}</h3></div><span class="badge ${s===3?'green':''}">${stages[s]}</span></div><div class="timeline">${stages.map((t,i)=>`<span class="step ${i<=s?'done':''}">${t}</span>`).join('')}</div><div class="dates"><div>Mayalama başlangıcı<strong>${date(b.started)}</strong></div><div>${b.bottled?'Şişelendi':'Şişeleme hedefi'}<strong>${date(b.bottled||plan.bottleTarget)}</strong></div></div>${sipPanel(b)}<div class="progress"><div style="width:${percent}%"></div></div><div class="progress-label"><span>${Math.max(0,elapsed)}. gün / ${duration} gün</span><span>${s===3?'İlk kadehe hazır':remaining?remaining+' gün kaldı':'Şişeleme zamanı'}</span></div><div class="card-action"><small>${b.bottled?b.remaining+' / '+b.count+' şişe · '+b.volume+' ml':'Güzel biralar aceleye gelmez.'}</small><button onclick="${b.bottled?'stockDetail':'bottle'}('${b.id}')">${b.bottled?'Stoku yönet':'Şişelemeyi kaydet'}</button></div></article>`}
function workshopHero(){const plans=batches.filter(b=>!b.bottled||b.remaining>0).map(b=>({batch:b,...brewPlan(b)})).sort((a,b)=>a.firstSip.localeCompare(b.firstSip));const next=plans.find(p=>daysSince(p.firstSip)<0)||plans.find(p=>!p.estimated)||plans[0];return `<section class="hero" aria-label="Atölye takvimi"><div><div class="eyebrow">ANKARA'DAN, ÖZENLE.</div><h2>Her partinin<br>bir hikâyesi var.</h2><p>Mayalamadan ilk kadehe, bütün tarihler bir arada. Sen biranı özenle kur; günleri birlikte sayalım.</p><div class="hero-note">EL YAPIMI · SINIRLI ÜRETİM · NO:9</div></div><div class="hero-calendar"><div class="label">${next?(next.estimated?'Sıradaki tahmini ilk içim':'Sıradaki ilk içim'):'ATÖLYENİN RİTMİ'}</div><strong>${next?date(next.firstSip):'14 + 14 gün'}</strong><p class="calendar-name">${next?esc(next.batch.name):'İyi biranın sırrı: biraz sabır.'}</p><p>${next?(daysSince(next.firstSip)>=0?(next.estimated?'Şişeleme kaydını bekliyor':'İlk kadehe hazır. Afiyet olsun!'):Math.abs(daysSince(next.firstSip))+' gün sonra ilk kadeh'): 'Mayalama ve ardından şişede olgunlaşma.'}</p><small>${next?(next.estimated?date(next.bottleTarget)+' tarihinde şişelersen. Gerçek tarihe göre güncellenir.':date(next.batch.bottled)+' tarihinde şişelendi · '+next.batch.conditionDays+' gün olgunlaşma'):'İlk üretimini ekle, şişeleme ve ilk içim takvimin oluşsun.'}</small></div></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let active=batches.filter(b=>stage(b)<3),ready=batches.filter(b=>stage(b)===3),stock=batches.reduce((s,b)=>s+(b.remaining||0),0),alerts=batches.filter(b=>stage(b)===1||stage(b)===3&&b.remaining>0);let heading=page==='stock'?'Şişe & stok':page==='settings'?'Atölye ayarları':page==='batches'?'Üretimlerim':'Atölyede neler oluyor?';let out=`<div class="heading"><div><div class="eyebrow">NO:9 BİRA DEFTERİ</div><h1>${heading}</h1><p>${page==='stock'?'İlk içim tarihlerin, şişelerin ve paylaşılacak güzel anlar.':page==='settings'?'Küçük atölyenin kontrol paneli.':'Özenle kur. Sabırla bekle. Keyifle iç.'}</p></div>${page==='settings'?'':`<button class="primary" onclick="newBatch()">＋ Yeni üretim</button>`}</div>`;
if(page==='settings'){out+=`<div class="card settings-card"><h3>Hesap & ortak defter</h3><p class="hint">${esc(user)} hesabıyla giriş yaptın. Bu siteye erişim verilen kullanıcılar aynı üretim ve stok defterini görür. Yeni kişilere erişim, sitenin paylaşım ayarlarından verilir.</p><h3 style="margin-top:26px">Varsayılan süreler</h3><p class="hint">14 gün mayalama · en az 14 gün şişede olgunlaşma.<br>Her üretimde süreleri değiştirebilirsin. Şişeleme hedefinde şişelersen tahmini ilk içim, kaydettiğin şişeleme tarihinden sonra ise gerçek ilk içim takvimi gösterilir.</p><button class="secondary" id="install" onclick="installApp()" style="margin-top:20px;display:${installPrompt?'inline-block':'none'}">Uygulamayı yükle</button><p class="hint">iPhone: Safari → Paylaş → Ana Ekrana Ekle. Diğer cihazlarda tarayıcının “Uygulamayı yükle” seçeneğini kullanabilirsin.</p><h3 style="margin-top:26px">Verilerin sende</h3><p class="hint">Üretim ve stok kayıtlarını JSON dosyası olarak indir.</p><button class="secondary" style="margin-top:15px" onclick="exportData()">Verileri dışa aktar ↓</button><p class="hint">Çevrimdışıyken uygulama kabuğu açılır; güncel kayıtlar ve değişiklikler için bağlantı gerekir.</p></div>`}
else if(page==='stock'){out+=`<p class="stock-summary">${stock} şişe · ${batches.filter(b=>b.bottled).length} şişelenmiş parti</p>`;out+=batches.filter(b=>b.bottled).map(b=>`<div class="stock-row"><div><div class="batch-no">PARTİ #${esc(b.number)}</div><h3>${esc(b.name)}</h3><small>${b.volume} ml · ${date(b.bottled)} tarihinde şişelendi</small><div class="stock-readiness">En erken ilk içim: <time datetime="${brewPlan(b).firstSip}">${date(brewPlan(b).firstSip)}</time> · ${stage(b)===3?'İçime hazır':stages[stage(b)]}</div></div><div class="stock-meta"><strong class="stock-quantity">${b.remaining}</strong> <small>/ ${b.count} şişe</small></div><button class="secondary" onclick="stockDetail('${b.id}')">Stoku yönet</button></div>`).join('')||'<div class="empty"><div class="symbol">▥</div><h3>Raflar ilk şişeleri bekliyor.</h3><p>Şişeleme kaydettiğinde stokların ve ilk içim tarihlerin burada görünecek.</p></div>'}
else{if(page==='overview')out+=workshopHero()+`<div class="stats"><div class="stat"><b aria-hidden="true">♧</b><div class="label">Aktif üretim</div><strong>${active.length.toString().padStart(2,'0')}</strong><small>Biraz daha sabır</small></div><div class="stat"><b aria-hidden="true">◷</b><div class="label">Olgunlaşan parti</div><strong>${batches.filter(b=>stage(b)===2).length.toString().padStart(2,'0')}</strong><small>Şişede güzelleşiyor</small></div><div class="stat"><b aria-hidden="true">♧</b><div class="label">İçime hazır parti</div><strong>${ready.length.toString().padStart(2,'0')}</strong><small>İlk kadehe hazır</small></div><div class="stat"><b aria-hidden="true">▥</b><div class="label">Toplam şişe</div><strong>${stock.toString().padStart(2,'0')}</strong><small>Atölyenin stoğu</small></div></div><div class="notice"><span style="font-size:24px;color:var(--amber)" aria-hidden="true">◷</span><div><strong>${alerts.length?alerts.length+' parti için zaman geldi':'Güzel biralar aceleye gelmez.'}</strong><p>${alerts.length?esc(alerts.map(b=>b.name+': '+(stage(b)===1?'şişeleme zamanı':'içime hazır')).join(' · ')):'Şişeleme ve ilk içim tarihlerini her üretim kartından takip edebilirsin.'}</p></div></div>`;
out+=`<div class="section-title"><h2>Atölyedeki üretimler <span class="section-count">${batches.length} parti</span></h2><span class="section-subtitle">Her partide biraz daha iyi.</span></div><div class="tabs">${[['all','Tümü'],['active','Devam eden'],['ready','İçime hazır']].map(([id,t])=>`<button class="${filter===id?'selected':''}" aria-pressed="${filter===id}" onclick="filter='${id}';render()">${t}</button>`).join('')}</div><div class="cards">`;let shown=batches.filter(b=>filter==='all'||(filter==='ready'?stage(b)===3:stage(b)<3));out+=shown.map(card).join('')||`<div class="empty"><div class="symbol">♧</div><h3>${batches.length?'Burada henüz bir parti yok.':'İlk güzel biranın hikâyesini başlat.'}</h3><p>Kitinin adını ve mayalamaya başladığın tarihi gir.<br>Şişelemeden ilk içime, takvimin burada oluşsun.</p><button class="primary" onclick="newBatch()">＋ İlk üretimi ekle</button></div>`;out+='</div>'}$('#content').innerHTML=out}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function closeModal(){$('#modal').close()}function newBatch(){modal(`<h2>Yeni bir hikâye başlasın.</h2><p>Kitinin adını yaz. Günleri biz sayalım.</p><form id="newForm"><label for="name">Biranın adı</label><input id="name" name="name" required maxlength="100" placeholder="Örn. Butik Bira Irish Stout"><label for="started">Mayalamaya başlama tarihi</label><input id="started" name="started" type="date" max="${today()}" value="${today()}" required><div class="row"><div><label>Mayalama (gün)</label><input aria-label="Mayalama gün sayısı" name="fermentDays" type="number" min="1" max="365" value="14" required></div><div><label>Şişede bekleme (gün)</label><input aria-label="Şişede bekleme gün sayısı" name="conditionDays" type="number" min="14" max="730" value="14" required></div></div><div class="form-plan" id="newPlan" role="status" aria-live="polite"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary">Üretimi başlat</button></div></form>`);const preview=()=>{const v=Object.fromEntries(new FormData($('#newForm')));if(!$('#newForm [name=started]').validity.valid||!v.started||!Number.isInteger(+v.fermentDays)||+v.fermentDays<1||+v.fermentDays>365||!Number.isInteger(+v.conditionDays)||+v.conditionDays<14||+v.conditionDays>730){$('#newPlan').textContent='Takvim için geçerli tarih ve süreleri gir.';return}const plan=brewPlan(v);$('#newPlan').innerHTML='<div class="plan-row"><span>Şişeleme hedefi</span><b>'+date(plan.bottleTarget)+'</b></div><div class="label">Hedefinde şişelersen ilk içim</div><strong>'+date(plan.firstSip)+'</strong><p>'+v.conditionDays+' gün şişede olgunlaşma. Gerçek şişeleme tarihine göre güncellenir.</p>'};$('#newForm').oninput=preview;preview();$('#newForm').onsubmit=async e=>{e.preventDefault();await mutate('batches','POST',Object.fromEntries(new FormData(e.target)),'Yeni üretim eklendi.')}}
function bottle(id){let b=batches.find(x=>x.id===id);modal(`<h2>Şişeleme zamanı.</h2><p>${esc(b.name)}</p><form id="bottleForm"><label>Şişeleme tarihi</label><input aria-label="Şişeleme tarihi" name="bottled" type="date" min="${b.started}" max="${today()}" value="${today()}" required><div class="row"><div><label>Şişe adedi</label><input aria-label="Şişe adedi" name="count" id="count" type="number" min="1" max="10000" value="46" required></div><div><label>Şişe hacmi (ml)</label><input aria-label="Şişe hacmi" name="volume" id="volume" type="number" min="50" max="5000" value="500" required></div></div><label>Şeker oranı (g/litre)</label><input aria-label="Şeker oranı" name="sugarRate" id="sugarRate" type="number" min="0" max="15" step="0.1" value="6" required><div class="notice" id="calc"></div><div class="form-plan" id="bottlePlan" role="status" aria-live="polite"></div><p class="hint">Oranı kitinin şişeleme talimatına göre ayarla. Gün sayısı tek başına fermantasyonun bittiğini göstermez; şişelemeden önce tamamlandığını doğrula.</p><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary">Şişelemeyi kaydet</button></div></form>`);const calc=()=>$('#calc').textContent=(+$('#count').value*+$('#volume').value/1000).toFixed(1)+' litre · toplam '+(+$('#count').value*+$('#volume').value/1000*+$('#sugarRate').value).toFixed(1)+' g şeker · şişe başına '+(+$('#volume').value/1000*+$('#sugarRate').value).toFixed(1)+' g';const preview=()=>{calc();const input=$('#bottleForm [name=bottled]');if(!input.value||!input.validity.valid){$('#bottlePlan').textContent='İlk içim tarihi için geçerli bir şişeleme tarihi seç.';return}const plan=brewPlan(b,input.value);$('#bottlePlan').innerHTML='<div class="label">Bu tarihte şişelersen en erken ilk içim</div><strong>'+date(plan.firstSip)+'</strong><p>Şişelemeden sonra '+b.conditionDays+' gün olgunlaşma.</p>'};$('#bottleForm').oninput=preview;preview();$('#bottleForm').onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));await mutate('batches/'+id,'PATCH',{...values,action:'bottle'},'Şişeleme kaydedildi. İlk içim: '+date(brewPlan(b,values.bottled).firstSip))}}
function stockDetail(id){let b=batches.find(x=>x.id===id);modal(`<h2>${esc(b.name)}</h2><p>${b.remaining} şişe kaldı · ${b.volume} ml</p>${sipPanel(b)}<form id="stockForm"><label>Stoktan düşülecek şişe adedi</label><input aria-label="Stoktan düşülecek şişe" type="number" name="amount" min="1" max="${b.remaining}" value="1" required><p class="hint">İçtiğin veya paylaştığın şişeleri stoktan düş.</p><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Kapat</button><button class="primary" ${!b.remaining?'disabled':''}>Stoktan düş</button></div></form>`);$('#stockForm').onsubmit=async e=>{e.preventDefault();await mutate('batches/'+id,'PATCH',{action:'consume',amount:+new FormData(e.target).get('amount')},'Stok güncellendi.')}}
async function mutate(path,method,data,message){let btn=$('dialog button.primary');if(btn)btn.disabled=true;try{await api(path,method,data);closeModal();await load();toast(message)}catch(e){toast(e.message);if(btn)btn.disabled=false}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'no:9',exportedAt:new Date().toISOString(),batches},null,2)],{type:'application/json'}));a.download='no9-bira-defteri.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#today').textContent=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(page==='settings')render()});async function installApp(){if(installPrompt){await installPrompt.prompt();installPrompt=null}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');window.addEventListener('online',load);setInterval(()=>{if(!$('#modal').open)load()},60000);load();
</script></body></html>
