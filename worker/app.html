const $=s=>document.querySelector(s);let batches=[],page='overview',filter='all',user='',installPrompt;const day=86400000,stages=['Mayalama','Şişeleme','Olgunlaşma','İçime hazır'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});const today=()=>new Date().toLocaleDateString('en-CA');const daysSince=d=>Math.floor((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/day);const addDays=(d,n)=>{let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toLocaleDateString('en-CA')};const stage=b=>b.bottled?(daysSince(b.bottled)>=b.conditionDays?3:2):(daysSince(b.started)>=b.fermentDays?1:0);function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}

function card(b){let s=stage(b),elapsed=daysSince(b.bottled||b.started),duration=b.bottled?b.conditionDays:b.fermentDays,remaining=Math.max(0,duration-elapsed),percent=Math.min(100,Math.max(0,elapsed/duration*100));return `<article class="card"><div class="card-top"><div><div class="batch-no">PARTİ #${esc(b.number)}</div><h3>${esc(b.name)}</h3></div><span class="badge ${s===3?'green':''}">${stages[s]}</span></div><div class="timeline">${stages.map((t,i)=>`<span class="step ${i<=s?'done':''}">${t}</span>`).join('')}</div><div class="dates"><div>${b.bottled?'Şişeleme tarihi':'Başlangıç tarihi'}<strong>${date(b.bottled||b.started)}</strong></div><div style="text-align:right">${b.bottled?'En erken içim':'Şişeleme hedefi'}<strong>${date(addDays(b.bottled||b.started,duration))}</strong></div></div><div class="progress"><div style="width:${percent}%"></div></div><div class="progress-label"><span>${Math.max(0,elapsed)}. gün / ${duration} gün</span><span>${s===3?'Keyif zamanı':remaining?remaining+' gün kaldı':'Şişeleme zamanı'}</span></div><div class="card-action"><small>${b.bottled?b.remaining+' / '+b.count+' şişe · '+b.volume+' ml':'Sabır, tarifin bir parçası.'}</small><button onclick="${b.bottled?'stockDetail':'bottle'}('${b.id}')">${b.bottled?'Stoku yönet ↗':'Şişelemeyi kaydet ↗'}</button></div></article>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let active=batches.filter(b=>stage(b)<3),ready=batches.filter(b=>stage(b)===3),stock=batches.reduce((s,b)=>s+(b.remaining||0),0),alerts=batches.filter(b=>stage(b)===1||stage(b)===3&&b.remaining>0);let heading=page==='stock'?'Şişe & stok':page==='settings'?'Atölye ayarları':page==='batches'?'Üretimlerim':'Bira güzel şey. Takibi de öyle.';let out=`<div class="heading"><div><h1>${heading}</h1><p>${page==='stock'?'Şişelerini say, keyfini planla.':page==='settings'?'Küçük atölyenin kontrol paneli.':'no:9 atölyesinde her şey yolunda.'}</p></div>${page==='settings'?'':`<button class="primary" onclick="newBatch()">＋ Yeni üretim</button>`}</div>`;
if(page==='settings'){out+=`<div class="card"><h3>Hesap & ortak defter</h3><p class="hint">${esc(user)} hesabıyla giriş yaptın. Bu siteye erişim verilen kullanıcılar aynı üretim ve stok defterini görür. Yeni kişilere erişim, sitenin paylaşım ayarlarından verilir.</p><h3 style="margin-top:26px">Varsayılan süreler</h3><p class="hint">14 gün mayalama · en az 14 gün şişede olgunlaşma.<br>Her üretimde süreleri değiştirebilirsin.</p><button class="secondary" id="install" onclick="installApp()" style="margin-top:20px;display:${installPrompt?'inline-block':'none'}">Uygulamayı yükle</button><p class="hint">iPhone: Safari → Paylaş → Ana Ekrana Ekle. Diğer cihazlarda tarayıcının “Uygulamayı yükle” seçeneğini kullanabilirsin.</p><h3 style="margin-top:26px">Verilerin sende</h3><p class="hint">Üretim ve stok kayıtlarını JSON dosyası olarak indir.</p><button class="secondary" style="margin-top:15px" onclick="exportData()">Verileri dışa aktar ↓</button><p class="hint">Çevrimdışıyken uygulama kabuğu açılır; güncel kayıtlar ve değişiklikler için bağlantı gerekir.</p></div>`}
else if(page==='stock'){out+=batches.filter(b=>b.bottled).map(b=>`<div class="stock-row"><div><h3>${esc(b.name)}</h3><small>${b.volume} ml · ${stages[stage(b)]} · ${date(b.bottled)}</small></div><div><strong style="font-size:24px">${b.remaining}</strong> <small>/ ${b.count} şişe</small></div><button class="secondary" onclick="stockDetail('${b.id}')">Stoku yönet</button></div>`).join('')||'<div class="empty"><div class="symbol">▥</div><h3>Raflar ilk şişeleri bekliyor.</h3><p>Şişeleme kaydettiğinde stokların burada görünecek.</p></div>'}

out+=`<div class="section-title"><h2>Atölyedeki üretimler <span style="color:var(--muted);font-size:13px;margin-left:8px">${batches.length} parti</span></h2><span style="color:var(--muted);font-size:11px">Her partide biraz daha iyi.</span></div><div class="tabs">${[['all','Tümü'],['active','Devam eden'],['ready','İçime hazır']].map(([id,t])=>`<button class="${filter===id?'selected':''}" onclick="filter='${id}';render()">${t}</button>`).join('')}</div><div class="cards">`;let shown=batches.filter(b=>filter==='all'||(filter==='ready'?stage(b)===3:stage(b)<3));out+=shown.map(card).join('')||`<div class="empty"><div class="symbol">♧</div><h3>${batches.length?'Burada henüz bir parti yok.':'İlk güzel biranın hikâyesini başlat.'}</h3><p>Kitinin adını ve mayalamaya başladığın tarihi gir.<br>Geri kalan günleri birlikte sayalım.</p><button class="primary" style="margin-top:22px" onclick="newBatch()">＋ İlk üretimi ekle</button></div>`;out+='</div>'}$('#content').innerHTML=out}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function closeModal(){$('#modal').close()}function newBatch(){modal(`<h2>Yeni bir hikâye başlasın.</h2><p>Kitinin adını yaz. Günleri biz sayalım.</p><form id="newForm"><label for="name">Biranın adı</label><input id="name" name="name" required maxlength="100" placeholder="Örn. Butik Bira Irish Stout"><label for="started">Mayalamaya başlama tarihi</label><input id="started" name="started" type="date" max="${today()}" value="${today()}" required><div class="row"><div><label>Mayalama (gün)</label><input aria-label="Mayalama gün sayısı" name="fermentDays" type="number" min="1" max="365" value="14" required></div><div><label>Şişede bekleme (gün)</label><input aria-label="Şişede bekleme gün sayısı" name="conditionDays" type="number" min="14" max="730" value="14" required></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary">Üretimi başlat</button></div></form>`);$('#newForm').onsubmit=async e=>{e.preventDefault();await mutate('batches','POST',Object.fromEntries(new FormData(e.target)),'Yeni üretim eklendi.')}}

async function mutate(path,method,data,message){let btn=$('dialog button.primary');if(btn)btn.disabled=true;try{await api(path,method,data);closeModal();await load();toast(message)}catch(e){toast(e.message);if(btn)btn.disabled=false}}
